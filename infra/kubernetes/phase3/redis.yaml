apiVersion: v1
kind: Service
metadata:
  name: geopulse-phase3-redis
  namespace: geopulse
spec:
  clusterIP: None
  selector:
    app: geopulse-phase3-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: geopulse-phase3-redis
  namespace: geopulse
spec:
  replicas: 1
  serviceName: geopulse-phase3-redis
  selector:
    matchLabels:
      app: geopulse-phase3-redis
  template:
    metadata:
      labels:
        app: geopulse-phase3-redis
    spec:
      containers:
        - name: redis
          image: redis:7.4.12-alpine
          args:
            - redis-server
            - --appendonly
            - "yes"
            - --appendfsync
            - everysec
            - --dir
            - /data
            - --save
            - "60"
            - "1"
          ports:
            - name: redis
              containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 2Gi
