apiVersion: batch/v1
kind: Job
metadata:
  name: geopulse-phase3-spark
  namespace: geopulse
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: spark
          image: geopulse-phase3-spark:0.1.0
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -m
            - streaming.main
          env:
            - name: REDIS_URL
              value: redis://geopulse-phase3-redis.geopulse.svc:6379/0
            - name: SPARK_CHECKPOINT_LOCATION
              value: file:///checkpoint
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: geopulse-kafka-bootstrap.kafka.svc:9092
            - name: KAFKA_TOPIC
              value: pings-phase3-live
            - name: PYSPARK_SUBMIT_ARGS
              value: --packages org.apache.spark:spark-sql-kafka-0-10_2.13:4.0.5 pyspark-shell
            - name: JAVA_TOOL_OPTIONS
              value: -XX:MaxRAMPercentage=60
          volumeMounts:
            - name: checkpoint
              mountPath: /checkpoint
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1536Mi
      volumes:
        - name: checkpoint
          persistentVolumeClaim:
            claimName: geopulse-phase3-checkpoint
