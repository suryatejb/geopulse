controller:
  replicas: 1
  workers: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

webhook:
  enable: true
  replicas: 1
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

spark:
  jobNamespaces:
    - geopulse
  serviceAccount:
    create: true
  rbac:
    create: true

prometheus:
  metrics:
    enable: false
