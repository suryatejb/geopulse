apiVersion: v1
kind: Service
metadata:
  name: geopulse-api
  namespace: geopulse
spec:
  type: ClusterIP
  selector:
    app: geopulse-api
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: geopulse-api
  namespace: geopulse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: geopulse-api
  template:
    metadata:
      labels:
        app: geopulse-api
    spec:
      containers:
        - name: api
          image: geopulse-api:0.1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: geopulse-database
                  key: database-url
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 384Mi
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
