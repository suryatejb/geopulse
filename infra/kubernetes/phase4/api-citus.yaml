apiVersion: v1
kind: Service
metadata:
  name: geopulse-api
  namespace: geopulse
spec:
  type: ClusterIP
  selector:
    app: geopulse-api
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: geopulse-api
  namespace: geopulse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: geopulse-api
  template:
    metadata:
      labels:
        app: geopulse-api
    spec:
      containers:
        - name: api
          image: geopulse-api:0.4.0
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: geopulse-citus-database
                  key: database-url
            - name: PING_INGESTION_MODE
              value: postgres
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: geopulse-kafka-bootstrap.kafka.svc:9092
            - name: REDIS_URL
              value: redis://geopulse-phase3-redis.geopulse.svc:6379/0
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 384Mi
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
