apiVersion: v1
kind: Service
metadata:
  name: geopulse-citus-coordinator-headless
  namespace: geopulse
spec:
  clusterIP: None
  selector:
    app: geopulse-citus
    role: coordinator
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: v1
kind: Service
metadata:
  name: geopulse-citus-coordinator
  namespace: geopulse
spec:
  selector:
    app: geopulse-citus
    role: coordinator
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: geopulse-citus-coordinator
  namespace: geopulse
spec:
  serviceName: geopulse-citus-coordinator-headless
  replicas: 1
  selector:
    matchLabels:
      app: geopulse-citus
      role: coordinator
  template:
    metadata:
      labels:
        app: geopulse-citus
        role: coordinator
    spec:
      containers:
        - name: citus
          image: citusdata/citus:14.2.0-pg17
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: geopulse-citus-database
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: geopulse-citus-database
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: geopulse-citus-database
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_HOST_AUTH_METHOD
              value: scram-sha-256
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: geopulse-citus-database
                  key: POSTGRES_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: geopulse-citus-database
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: standard
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: geopulse-citus-workers
  namespace: geopulse
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: geopulse-citus
    role: worker
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
