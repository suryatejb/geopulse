<svg xmlns="http://www.w3.org/2000/svg" width="880" height="500" viewBox="0 0 880 500">
<style>
text{font-family:Arial,sans-serif;fill:#1f2937}
.title{font-size:23px;font-weight:700}
.axis-label{font-size:16px}
.tick,.legend,.value{font-size:14px}
.baseline{stroke:#b42318;fill:none}
.kafka{stroke:#175cd3;fill:none}
.grid{stroke:#d0d5dd;stroke-width:1}
</style>
<rect width="100%" height="100%" fill="white"/>
<text x="440" y="38" text-anchor="middle" class="title">p95 latency: PostgreSQL baseline vs Kafka</text>
<line x1="120" y1="85" x2="120" y2="390" class="grid"/>
<line x1="120" y1="390" x2="790" y2="390" class="grid"/>
<line x1="120.0" y1="390" x2="120.0" y2="396" class="grid"/>
<text x="120.0" y="417" text-anchor="middle" class="tick">500</text>
<line x1="455.0" y1="390" x2="455.0" y2="396" class="grid"/>
<text x="455.0" y="417" text-anchor="middle" class="tick">600</text>
<line x1="790.0" y1="390" x2="790.0" y2="396" class="grid"/>
<text x="790.0" y="417" text-anchor="middle" class="tick">700</text>
<text x="455.0" y="465" text-anchor="middle" class="axis-label">Target rate (pings/s)</text>
<text x="28" y="245" text-anchor="middle" class="axis-label" transform="rotate(-90 28 245)">p95 latency (ms, logarithmic scale)</text>
<polyline points="120.0,318.8 455.0,123.2 790.0,85.0" class="baseline" stroke-width="3"/>
<polyline points="120.0,375.3 455.0,387.9 790.0,390.0" class="kafka" stroke-width="3"/>
<circle cx="120.0" cy="318.8" r="6" fill="#b42318"/>
<text x="130.0" y="308.8" class="value">33 ms</text>
<circle cx="455.0" cy="123.2" r="6" fill="#b42318"/>
<text x="465.0" y="113.2" class="value">3,929 ms</text>
<circle cx="790.0" cy="85.0" r="6" fill="#b42318"/>
<text x="780.0" y="75.0" class="value" text-anchor="end">10,000 ms (timeout)</text>
<circle cx="120.0" cy="375.3" r="6" fill="#175cd3"/>
<text x="130.0" y="365.3" class="value">8.3 ms</text>
<circle cx="455.0" cy="387.9" r="6" fill="#175cd3"/>
<text x="465.0" y="377.9" class="value">6.1 ms</text>
<circle cx="790.0" cy="390.0" r="6" fill="#175cd3"/>
<text x="780.0" y="380.0" class="value" text-anchor="end">5.8 ms</text>
<line x1="615" y1="65" x2="645" y2="65" class="baseline" stroke-width="3"/>
<text x="653" y="70" class="legend">PostgreSQL baseline</text>
<line x1="615" y1="88" x2="645" y2="88" class="kafka" stroke-width="3"/>
<text x="653" y="93" class="legend">Kafka</text>
</svg>
